<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>DOM: Conexion HTML</h1>
    </header>

<main>

    <section>
        <form action="">
            <h2>
                ejercicio saludo
            </h2>
            <label for="">INgresa tu nombre</label>
            <input type="text" id="nombre">

            <input type="button" onclick="saludar()" value="aceptar">
        </form>
    </section>

    <section>
        <form action="">
            <H2>JS- EFECTO</H2>
        <label for=""> cambiar a modo oscuro</label>
        <input type="button" onclick="oscuro()" value="ACTIVAR MODO OSCURO">
        </form>
    </section>

    <section>
        <form action="">
            <h2> Ejercicio suma</h2>
            <label for="">numero 1</label>
            <input type="number" required id="n1"> 

             <label for="">numero 2</label>
            <input type="number" required id="n2">

             <label for="">resultado</label>
            <input type="number" required id="resultado">

            <input type="button" onclick="sumar()"  value="suma ">

        </form>
    </section>
</main>
    <script src="js/script.js"> </script>
</body>
</html>
